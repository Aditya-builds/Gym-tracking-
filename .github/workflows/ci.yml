name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Verify package build
        run: mvn -B package -DskipTests

      - name: Package backend distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd target
          zip -r gym-tracker-quarkus-app.zip quarkus-app/

      - name: Upload backend artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-backend
          path: backend/target/gym-tracker-quarkus-app.zip
          retention-days: 90

  jmh-benchmarks:
    name: JMH microbenchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run JMH benchmarks
        run: mvn -B test-compile exec:java@run-jmh -Pbenchmark

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f target/jmh-results.json ]; then
            echo "## JMH benchmark results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Benchmark | Avg time | Unit |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-----------|----------|------|" >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const rows = require('./target/jmh-results.json');
              for (const row of rows) {
                const name = row.benchmark.split('.').pop();
                const score = row.primaryMetric.score.toFixed(3);
                const unit = row.primaryMetric.scoreUnit;
                console.log('| ' + name + ' | ' + score + ' | ' + unit + ' |');
              }
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: backend/target/jmh-results.json
          if-no-files-found: ignore

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  web:
    name: Web (plan parser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run plan parser tests
        run: node --test plan-parser.test.mjs
